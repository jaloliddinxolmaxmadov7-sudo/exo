plugins { id 'com.android.application' }

def vc = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'uz.ezome.app'
    compileSdk 35
    defaultConfig {
        applicationId 'uz.ezome.app'
        minSdk 24
        targetSdk 35
        versionCode vc
        versionName "1.0.${vc}"
    }
    signingConfigs {
        sideload {
            storeFile file('ezome-sideload.jks')
            storePassword 'ezome-sideload'
            keyAlias 'ezome'
            keyPassword 'ezome-sideload'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
