name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: APK yig'ish
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: APK ni saytga qo'yish
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ezome.apk
          ls -la ezome.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add ezome.apk
          git commit -m "ezome.apk yangilandi (build ${GITHUB_RUN_NUMBER})" || echo "o'zgarish yo'q"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: ezome-apk
          path: ezome.apk
